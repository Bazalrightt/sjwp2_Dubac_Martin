<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Counter</h1>
    <div class="box">
      <span id="count">0</span>
      <div class="buttons">
        <button id="decrease" aria-label="Decrease">&minus;</button>
        <button id="increase" aria-label="Increase">+</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
